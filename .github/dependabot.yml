version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    open-pull-requests-limit: 2
    pull-request-branch-name:
      separator: "-"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
